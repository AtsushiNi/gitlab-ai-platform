[project]
name = "gitlab-ai-platform"
version = "0.1.0"
description = "AI development platform for internal GitLab: MR review automation and, eventually, Issue-driven design/implementation."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitlab_ai_platform"]
