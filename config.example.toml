# このファイルを config.toml にコピーして値を設定する(config.toml はコミットしない)
#
# シークレット(GitLab PAT)はここではなく .env に置く

[gitlab]
url = "https://gitlab.example.com"
projects = ["group/project-a", "group/project-b"]

[poller]
interval_seconds = 60
max_parallel = 5

[review]
label = "レビュー待ち"

[workspace]
root = "workspace"
max_disk_mb = 5000

[runner]
log_dir = "logs/runner"
timeout_seconds = 1800

[reviews]
root = "reviews"

[store]
db_path = "state.db"
